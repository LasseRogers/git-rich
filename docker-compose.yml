name: git-rich

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${USER:?USER is not set}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

x-ml-env: &ml-env
  <<: *app-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  GIT_PYTHON_REFRESH: quiet

# All Python services run the same image, so one build updates every job.
x-app: &app
  image: git-rich-app
  build: .

x-job: &job
  <<: *app
  profiles: [jobs]
  depends_on:
    migrate:
      condition: service_completed_successfully

x-ml-job: &ml-job
  <<: *job
  depends_on:
    migrate:
      condition: service_completed_successfully
    mlflow:
      condition: service_healthy
  environment: *ml-env

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER:?USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    command: alembic upgrade head

  ingest:
    <<: *job
    environment: *app-env
    entrypoint: [ingest-lol]

  ingest-odds:
    <<: *job
    environment:
      <<: *app-env
      TEAM_ALIASES: /aliases.csv
    volumes:
      - ./data/odds:/odds:ro
      - ./gitrich/odds/team_aliases.csv:/aliases.csv:ro
    entrypoint: [ingest-odds]

  train-elo:
    <<: *ml-job
    entrypoint: [train-elo]

  backtest:
    <<: *ml-job
    entrypoint: [backtest]

  mlflow:
    build: ./services/mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${USER:?USER is not set}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts localhost,localhost:*,127.0.0.1:*,mlflow,mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  pgdata:
  mlflow_artifacts:
