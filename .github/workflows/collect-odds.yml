name: collect-odds

# Triggered through the API by an external scheduler: GitHub's own cron drops and delays runs.
# 07:23 and 15:23 UTC with pinnacle and bet365, 21:23 UTC with pinnacle only (~250 free requests a month).
on:
  workflow_dispatch:
    inputs:
      bookmakers:
        description: Space-separated bookmaker slugs
        default: pinnacle

permissions:
  contents: write

concurrency:
  group: collect-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - uses: actions/checkout@v5
        with:
          ref: odds-data
          path: data

      - name: Collect
        working-directory: src
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          BOOKMAKERS: ${{ inputs.bookmakers }}
        run: |
          args=()
          for b in $BOOKMAKERS; do args+=(--bookmaker "$b"); done
          python3 -m gitrich.odds.collect --out ../data "${args[@]}"

      # Runs on failure too, so the request counter is never lost.
      - name: Commit
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
