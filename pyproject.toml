[project]
name = "git-rich"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "pandas==3.1.0",
    "gdown==6.4.2",
    "numpy==2.5.4",
    "pyarrow==26.0.0",
    "mlflow-skinny==3.17.2",
    "lightgbm==4.7.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "streamlit==1.66.1",
]

[project.scripts]
ingest-lol = "gitrich.lol.ingest:main"
ingest-odds = "gitrich.odds.ingest:main"
train-elo = "gitrich.models.train_elo:main"
train-lgbm = "gitrich.models.train_lgbm:main"
train-logreg = "gitrich.models.train_logreg:main"
backtest = "gitrich.models.backtest:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gitrich*"]

[tool.setuptools.package-data]
gitrich = ["odds/*.csv"]
